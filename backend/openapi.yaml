openapi: 3.0.3
info:
  title: EtymoloGuessr API
  version: 0.1.0
  description: Thin JSON layer over pregenerated etymology puzzles. Gold answers are never returned on GET.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness and database ping
      responses:
        "200":
          description: OK
        "503":
          description: Database unavailable
  /puzzles/random:
    get:
      summary: Fetch a random enabled puzzle prompt
      parameters:
        - in: query
          name: mode
          schema:
            type: string
            enum: [easy, hard, medium]
            default: easy
        - in: query
          name: langPair
          schema:
            type: string
            example: de-en
        - in: query
          name: minQuality
          schema:
            type: integer
        - in: query
          name: exclude
          description: Comma-separated or repeated puzzle IDs to avoid when selecting a random puzzle.
          schema:
            type: string
      responses:
        "200":
          description: Prompt without correctChoice or gold edges
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PuzzlePrompt"
                  - $ref: "#/components/schemas/MediumPrompt"
        "400":
          description: Invalid mode
        "404":
          description: No enabled puzzles match the filter
  /puzzles/{id}:
    get:
      summary: Fetch a puzzle prompt by id
      description: >
        Used by the UI puzzle lock to re-fetch after refresh. Same prompt
        contract as GET /puzzles/random (never gold or correctChoice).
        404 clears a lock if generate --db deleted the row.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: mode
          schema:
            type: string
            enum: [easy, hard, medium]
            default: easy
      responses:
        "200":
          description: Prompt without correctChoice or gold edges
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PuzzlePrompt"
                  - $ref: "#/components/schemas/MediumPrompt"
        "400":
          description: Invalid mode
        "404":
          description: Puzzle missing, disabled, or not eligible for the mode (hard requires at least 4 nodes)
  /puzzles/{id}/solve:
    post:
      summary: Score a submission and reveal gold
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveRequest"
      responses:
        "200":
          description: Graded submission with gold graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolveResponse"
        "404":
          description: Puzzle missing or disabled
components:
  schemas:
    Term:
      type: object
      properties:
        lang: { type: string }
        term: { type: string }
        gloss: { type: string, nullable: true }
    Choice:
      type: object
      properties:
        id: { type: string }
        gloss: { type: string }
    Graph:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              lang: { type: string }
              term: { type: string }
              gloss: { type: string, nullable: true }
              role: { type: string, enum: [leaf, ancestor] }
        edges:
          type: array
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
              reltype: { type: string }
    PuzzlePrompt:
      type: object
      properties:
        id: { type: string }
        mode: { type: string, enum: [easy, hard] }
        langPair: { type: string }
        leafA: { $ref: "#/components/schemas/Term" }
        leafB: { $ref: "#/components/schemas/Term" }
        choices:
          type: array
          items: { $ref: "#/components/schemas/Choice" }
        promptGraph:
          $ref: "#/components/schemas/Graph"
          description: Hard mode only. All gold nodes with glosses kept, edges empty. Omitted for easy (use leafA/leafB).
    SolveRequest:
      type: object
      properties:
        mode: { type: string, enum: [easy, hard, medium] }
        choiceId: { type: string, description: Easy mode }
        edges:
          type: array
          description: Hard mode directed edges
          items:
            type: object
            properties:
              from: { type: string }
              to: { type: string }
        pairs:
          type: array
          description: Medium mode pairs of opaque leaf IDs.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
    SolveResponse:
      type: object
      properties:
        correct: { type: boolean }
        goldGraph: { $ref: "#/components/schemas/Graph" }
        choices:
          type: array
          items: { $ref: "#/components/schemas/Choice" }
        correctChoice: { type: string }
        ancestors:
          type: array
          description: Medium mode common ancestors, in puzzle-set order.
          items: { $ref: "#/components/schemas/Term" }
    MediumLeaf:
      type: object
      required: [id, lang, term]
      properties:
        id: { type: string, description: Opaque leaf ID }
        lang: { type: string }
        term: { type: string }
    MediumPrompt:
      type: object
      required: [id, mode, leaves]
      properties:
        id: { type: string, description: Comma-separated medium puzzle-set ID }
        mode: { type: string, enum: [medium] }
        leaves:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: "#/components/schemas/MediumLeaf" }

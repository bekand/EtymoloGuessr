name: etymoguessr-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etymoguessr
      POSTGRES_PASSWORD: etymoguessr
      POSTGRES_DB: etymoguessr
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etymoguessr -d etymoguessr"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://etymoguessr:etymoguessr@db:5432/etymoguessr?sslmode=disable
      HTTP_ADDR: :8080
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTO_MIGRATE: "true"
    ports:
      - "18080:8080"

# Local Compose Postgres (see docker-compose.yml). DATABASE_URL env overrides this.
database_url: postgres://etymoguessr:etymoguessr@localhost:5432/etymoguessr?sslmode=disable

# Leaf languages use Wiktionary English names; codes are used in lang_pair ids.
leaf_languages:
  English: en
  Spanish: es
  Portuguese: pt
  German: de

ancestor_languages:
  - Latin
  - Vulgar Latin
  - Old Latin
  - Old Spanish
  - Old Galician-Portuguese
  - Galician
  - Old Portuguese
  - Old French
  - Middle French
  - Anglo-Norman
  - Old Occitan
  - Gothic
  - Old English
  - Middle English
  - Old High German
  - Middle High German
  - Old Saxon
  - Middle Low German
  - Old Dutch
  - Middle Dutch
  - Old Norse
  - Old Frisian
  - Proto-West Germanic
  - Proto-Germanic
  - Proto-Indo-European
  - Proto-Italic
  - Proto-Celtic
  - Ancient Greek
  - Byzantine Greek
  - Arabic
  - Hebrew
  - Classical Nahuatl
  - Persian
  - Middle Persian
  - Old Persian
  - Sanskrit
  - Frankish
  - Medieval Latin
  - Late Latin
  - Proto-Indo-Iranian

keep_reltypes:
  - inherited_from
  - borrowed_from
  - derived_from
  - root
  - cognate_of
  - doublet_with

ancestor_reltypes:
  - inherited_from
  - borrowed_from
  - derived_from
  - root

generate:
  n: 0 # full pass
  min_quality: 4
  max_nodes: 9
  max_gloss_overlap: 0.5
  n_choices: 4
  seed: 89

sources:
  etymology:
    name: etymology.parquet
    url: https://github.com/droher/etymology-db/releases/download/2023-12/etymology.parquet
    sha256: null
    bytes_estimate: 140247040
    license: CC BY-SA 3.0
  glosses:
